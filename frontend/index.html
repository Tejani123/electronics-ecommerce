<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Electronics | Premium Tech Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; height: 100%;">
            <div class="logo"><a href="index.html" style="text-decoration: none; color: var(--primary); font-weight: 700; font-size: 1.2rem;">ZENITH</a></div>
            <div class="nav-links" style="display: flex; gap: 30px;">
                <a href="products.html" style="text-decoration: none; color: var(--text-main);">Products</a>
                <a href="cart.html" style="text-decoration: none; color: var(--text-main);">Cart (<span id="cart-count">0</span>)</a>
                <div id="auth-links">
                    <a href="login.html" style="text-decoration: none; color: var(--text-main);">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <header style="padding: 100px 0; background: var(--secondary); text-align: center;">
        <div class="container">
            <h1 style="font-size: 3.5rem; margin-bottom: 20px;">The Next Generation of Tech.</h1>
            <p style="color: var(--text-muted); font-size: 1.2rem; margin-bottom: 40px;">Explore our curated collection of high-performance electronics.</p>
            <a href="products.html" class="btn">Shop Now</a>
        </div>
    </header>

    <main class="container">
        <section style="padding: 60px 0;">
            <h2 style="margin-bottom: 40px;">Featured Products</h2>
            <div id="featured-grid" class="product-grid"></div>
        </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
