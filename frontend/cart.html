<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Zenith Electronics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; height: 100%;">
            <div class="logo"><a href="index.html" style="text-decoration: none; color: var(--primary); font-weight: 700; font-size: 1.2rem;">ZENITH</a></div>
            <div class="nav-links" style="display: flex; gap: 30px;">
                <a href="products.html" style="text-decoration: none; color: var(--text-main);">Products</a>
                <a href="cart.html" style="text-decoration: none; color: var(--accent); font-weight: 600;">Cart (<span id="cart-count">0</span>)</a>
                <div id="auth-links"></div>
            </div>
        </div>
    </nav>

    <main class="container" style="padding: 60px 0;">
        <h1>Shopping Cart</h1>
        
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 40px; margin-top: 40px;">
            <div id="cart-items-container"></div>
            
            <div style="background: var(--secondary); padding: 30px; border-radius: 12px; height: fit-content;">
                <h3 style="margin-bottom: 20px;">Order Summary</h3>
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: 600; font-size: 1.2rem; border-top: 1px solid #ddd; pt: 20px;">
                    <span>Total</span>
                    <span id="total">$0.00</span>
                </div>
                <button onclick="window.location.href='checkout.html'" class="btn" style="width: 100%;">Proceed to Checkout</button>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', renderCart);

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('subtotal');
            const totalEl = document.getElementById('total');
            
            if (cart.length === 0) {
                container.innerHTML = '<p>Your cart is empty.</p>';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div style="display: flex; gap: 20px; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--secondary);">
                    <img src="${item.image}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;">
                    <div style="flex-grow: 1;">
                        <h4 style="margin-bottom: 5px;">${item.name}</h4>
                        <p style="color: var(--text-muted); font-size: 0.9rem;">$${item.price.toFixed(2)}</p>
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button onclick="updateQty(${item.id}, -1)" style="border: none; background: #eee; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateQty(${item.id}, 1)" style="border: none; background: #eee; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;">+</button>
                    </div>
                    <p style="font-weight: 600; min-width: 80px; text-align: right;">$${(item.price * item.quantity).toFixed(2)}</p>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            subtotalEl.textContent = `$${total.toFixed(2)}`;
            totalEl.textContent = `$${total.toFixed(2)}`;
        }

        function updateQty(id, change) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                localStorage.setItem('zenith_cart', JSON.stringify(cart));
                updateCartCount();
                renderCart();
            }
        }
    </script>
</body>
</html>
