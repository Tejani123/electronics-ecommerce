<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Zenith Electronics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; height: 100%;">
            <div class="logo"><a href="index.html" style="text-decoration: none; color: var(--primary); font-weight: 700; font-size: 1.2rem;">ZENITH</a></div>
            <div class="nav-links" style="display: flex; gap: 30px;">
                <a href="products.html" style="text-decoration: none; color: var(--accent); font-weight: 600;">Products</a>
                <a href="cart.html" style="text-decoration: none; color: var(--text-main);">Cart (<span id="cart-count">0</span>)</a>
                <div id="auth-links"></div>
            </div>
        </div>
    </nav>

    <main class="container" style="padding-top: 40px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
            <h1>All Electronics</h1>
            <select id="category-filter" style="padding: 10px; border-radius: 8px; border: 1px solid var(--secondary);">
                <option value="all">All Categories</option>
            </select>
        </div>
        
        <div id="products-grid" class="product-grid"></div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts(products);
            setupCategoryFilter();
        });

        function setupCategoryFilter() {
            const filter = document.getElementById('category-filter');
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                filter.appendChild(option);
            });

            filter.addEventListener('change', (e) => {
                const selected = e.target.value;
                const filtered = selected === 'all' ? products : products.filter(p => p.category === selected);
                renderProducts(filtered);
            });
        }
    </script>
</body>
</html>
