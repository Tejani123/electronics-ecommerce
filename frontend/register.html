<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Zenith Electronics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: var(--secondary); display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div style="background: var(--white); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
        <h2 style="margin-bottom: 10px;">Create Account</h2>
        <p style="color: var(--text-muted); margin-bottom: 30px;">Join our premium tech community.</p>
        
        <form id="register-form">
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem;">Full Name</label>
                <input type="text" id="name" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem;">Email Address</label>
                <input type="email" id="email" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            <div style="margin-bottom: 30px;">
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem;">Password</label>
                <input type="password" id="password" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Create Account</button>
        </form>
        
        <p style="margin-top: 25px; text-align: center; font-size: 0.9rem;">
            Already have an account? <a href="login.html" style="color: var(--accent); text-decoration: none;">Login</a>
        </p>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
